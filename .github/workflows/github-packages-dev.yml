name: GitHub Packages Dev

# Main-tracking dev feed for the fork sergey-v9/ladybug-dotnet.
#
# Instead of downloading a published engine RELEASE, this workflow builds lbug_shared FROM SOURCE at the
# upstream commit pinned in upstream-engine.pin (per RID), stages it, packs the family as a
# `<engine_version>-dev.<run>.<attempt>.eng-<engineShort>` prerelease, publishes to GitHub Packages, and
# verifies the published packages on every shipped RID. Advance the pin via docs/upstream-sync.md.
#
# The repository/ref guards keep this inert anywhere but the fork's dev branch.

on:
  push:
    branches:
      - dev
    # Doc-only changes don't affect the native build or package payload — skip the ~1h cross-RID
    # build+publish for them. A pin/version/code change (not under these globs) still triggers.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  pin:
    if: github.repository == 'sergey-v9/ladybug-dotnet' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.read.outputs.commit }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Read upstream-engine.pin and compute the prerelease version
        id: read
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=$(grep -E '^commit=' upstream-engine.pin | head -1 | cut -d= -f2 | tr -d '[:space:]')
          ENGINE_VERSION=$(grep -E '^engine_version=' upstream-engine.pin | head -1 | cut -d= -f2 | tr -d '[:space:]')
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "pin commit must be a full 40-char SHA, got '$COMMIT'" >&2; exit 1; }
          [[ "$ENGINE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "engine_version must be X.Y.Z, got '$ENGINE_VERSION'" >&2; exit 1; }
          VERSION="${ENGINE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.eng-${COMMIT:0:9}"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building bindings against LadybugDB/ladybug@${COMMIT:0:9}; package version $VERSION"

  build-native:
    needs: pin
    name: build native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64,     os: windows-latest }
          - { rid: osx-x64,     os: macos-15-intel }
          - { rid: osx-arm64,   os: macos-latest }
    steps:
      - name: Checkout engine @ pin
        uses: actions/checkout@v6
        with:
          repository: LadybugDB/ladybug
          ref: ${{ needs.pin.outputs.commit }}
          submodules: recursive
          path: engine

      # Toolchain mirrors LadybugDB/ladybug precompiled-bin-workflow.yml. The shared-lib build needs
      # OpenSSL + pkg-config + python3 (codegen); a bare `cmake ninja-build` install was the Linux
      # failure mode (macOS/Windows runners ship these preinstalled, which is why only Linux was red).
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make cmake ninja-build g++-13 python3 python3-pip git ccache curl libssl-dev pkg-config

      - name: Install CMake + Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        # Knowingly Node 20: the latest release (v1.13.0) still targets node20, so this is the one
        # action that keeps GitHub's node20-deprecation warning on the Windows job until upstream ships
        # a node24 release. Nothing to bump yet; don't "fix" by pinning — no node24 version exists.
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Warm a compiler cache across dev pushes (Linux/macOS). The engine's CMake honours the
      # CMAKE_*_COMPILER_LAUNCHER env vars, so wiring ccache is just exporting them in the build step.
      # Windows (MSVC) is intentionally left uncached this round — sccache+MSVC needs /Z7 debug info
      # and is a separate, riskier change; Windows is the critical-path RID and its speedup is a follow-up.
      - name: Set up ccache (Linux/macOS)
        if: runner.os != 'Windows'
        # Pinned to a patch: v1.2.23 runs on Node 24, but the floating `@v1` tag still points at an
        # older Node-20 release (GitHub deprecation warning). Bump when the maintainer moves `@v1`.
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: dev-native-${{ matrix.rid }}
          max-size: 2G

      # One configure per RID builds the shared C-API library AND the fts/vector extensions. `lbug`
      # (the static lib the Windows extensions link against) and `lbug_shared` share an OBJECT-library
      # (src/CMakeLists.txt: both built from $<TARGET_OBJECTS:...>), so the extra Windows target costs a
      # link, not a second compile. Direct CMake on every platform now that the Linux deps
      # (OpenSSL/pkg-config/python3) are installed — the engine `make` wrapper added nothing
      # CMake-specific beyond the generator, and building only these targets drops the shell/CLI/static
      # build the old Linux `make install` did (most of the Linux speedup).
      - name: Build engine + fts/vector extensions
        shell: bash
        working-directory: engine
        run: |
          set -euo pipefail
          extra=()
          if [ "${RUNNER_OS}" = "Linux" ]; then
            export CC=gcc-13 CXX=g++-13
          fi
          if [ "${RUNNER_OS}" != "Windows" ]; then
            export CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
            # Linux/macOS extensions use runtime dynamic lookup (RTLD_GLOBAL / -undefined dynamic_lookup),
            # so the static lib is unneeded there — drop it for speed. On Windows the extensions link
            # against the static `lbug` target (no dynamic lookup), so leave BUILD_STATIC_LBUG at its
            # default (ON), matching the engine's own extension build.
            extra+=("-DBUILD_STATIC_LBUG=OFF")
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHELL=OFF -DBUILD_SINGLE_FILE_HEADER=OFF -DBUILD_TESTS=OFF \
            -DBUILD_EXTENSIONS="fts;vector" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "${extra[@]}" \
            .
          cmake --build build --target lbug_shared lbug_fts_extension lbug_vector_extension

      - name: Stage native + ABI-matched fts/vector extensions under runtimes/<rid>/native
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.rid }}" in
            win-*) ext=dll;   canonical=lbug_shared.dll ;;
            osx-*) ext=dylib; canonical=liblbug.dylib ;;
            *)     ext=so;    canonical=liblbug.so ;;
          esac
          dest="out/runtimes/${{ matrix.rid }}/native"
          mkdir -p "$dest"

          # Shared library: largest real *lbug*.<ext>* under the build tree (CMake emits the SONAME
          # chain liblbug.so -> .so.0 -> .so.0.x.y; we want the real file, under the canonical name).
          built=$(find engine/build/src -type f -name "*lbug*.${ext}*" ! -name '*.lib' 2>/dev/null | xargs ls -S 2>/dev/null | head -1)
          [ -n "$built" ] || { echo "no *lbug*.${ext} produced" >&2; find engine/build -name '*lbug*' 2>/dev/null | head -50; exit 1; }
          cp "$built" "$dest/${canonical}"
          echo "staged native $built -> $dest/${canonical}"

          # fts/vector extensions, built from the SAME engine commit so their ABI matches the engine.
          # The published 0.17.0 extensions do NOT match a 0.18.0-dev engine — they crash with an
          # undefined `Catalog::createIndex`. The engine resolves `INSTALL`/`LOAD EXTENSION <name>` from
          # ~/.lbdb/extension/<EXT_VER>/<platform>/<name>/lib<name>.lbug_extension; we ship these FLAT next
          # to the native (NuGet reliably copies top-level runtimes/<rid>/native files to consumer output;
          # nested subdirs are not guaranteed) so the binding can pre-seed that cache (Interop/
          # ExtensionStaging.cs). EXT_VER is the engine's compile-time LBUG_EXTENSION_VERSION — re-read it
          # each pin bump; it is NOT engine_version.
          for name in fts vector; do
            f=$(find "engine/extension/${name}/build" -type f -name "lib${name}.lbug_extension" 2>/dev/null | head -1)
            [ -n "$f" ] || { echo "no lib${name}.lbug_extension produced" >&2; find engine/extension -name '*.lbug_extension' 2>/dev/null | head; exit 1; }
            cp "$f" "$dest/lib${name}.lbug_extension"
            echo "staged extension $f"
          done
          EXT_VER=$(grep -oE 'LBUG_EXTENSION_VERSION="[^"]+"' engine/CMakeLists.txt | head -1 | sed -E 's/.*="([^"]+)"/\1/')
          [ -n "$EXT_VER" ] || { echo "could not read LBUG_EXTENSION_VERSION from engine/CMakeLists.txt" >&2; exit 1; }
          printf '%s' "$EXT_VER" > "$dest/lbug_extension_abi_version.txt"
          echo "extension ABI version: $EXT_VER"
          find "$dest" -type f -print

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          # Flat layout: native + the two .lbug_extension files + the ABI marker, all at native/ root.
          path: out/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [pin, build-native]
    if: github.repository == 'sergey-v9/ladybug-dotnet' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      package-version: ${{ needs.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download source-built natives
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: staged

      - name: Stage natives into lib/runtimes (so Cake reuses them, no release download)
        shell: bash
        run: |
          set -euo pipefail
          # Each native-<rid> artifact holds just the canonical shared lib at its root
          # (upload-artifact collapses single-file uploads to the bare file name), so the
          # runtimes/<rid>/native/ layout the Cake packaging step expects must be rebuilt
          # here. Downloading without merge-multiple keeps every artifact in its own
          # staged/native-<rid>/ directory, which encodes the RID.
          shopt -s nullglob
          mkdir -p lib/runtimes
          for d in staged/native-*; do
            rid="${d##*/native-}"
            mkdir -p "lib/runtimes/${rid}/native"
            # Flat artifact: native + the two .lbug_extension files + the ABI marker.
            cp "$d"/* "lib/runtimes/${rid}/native/"
          done
          find lib/runtimes -type f -print

      - name: Test gate (host RID) against the source-built native
        run: >
          dotnet run --project cake/LadybugDB.Build.csproj -- --target Test

      - name: Pack + verify the full package family
        run: >
          dotnet run --project cake/LadybugDB.Build.csproj --
          --target Pack
          --package-version "${{ needs.pin.outputs.version }}"
          --repository-url "https://github.com/sergey-v9/ladybug-dotnet"

      - name: Configure GitHub Packages source
        run: >
          dotnet nuget add source
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/sergey-v9/index.json"

      - name: Push packages to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source github
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
          --no-symbols

  consume-published:
    if: github.repository == 'sergey-v9/ladybug-dotnet' && github.ref == 'refs/heads/dev'
    needs: publish
    name: consume published (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    env:
      PACKAGE_VERSION: ${{ needs.publish.outputs.package-version }}
      RID: ${{ matrix.rid }}
      NuGetPackageSourceCredentials_github_ladybug: "Username=sergey-v9;Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic"
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and run published package consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $work = Join-Path $env:RUNNER_TEMP "ladybug-published-consumer"
          if (Test-Path $work) {
            Remove-Item -LiteralPath $work -Recurse -Force
          }

          dotnet new console --framework net10.0 --name LadybugPublishedConsumer --output $work
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $project = Join-Path $work "LadybugPublishedConsumer.csproj"
          $config = Join-Path $work "NuGet.config"
          $program = Join-Path $work "Program.cs"

          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <RuntimeIdentifier>$($env:RID)</RuntimeIdentifier>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="LadybugDB" Version="$($env:PACKAGE_VERSION)" />
              <PackageReference Include="LadybugDB.Native.$($env:RID)" Version="$($env:PACKAGE_VERSION)" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -LiteralPath $project

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="github_ladybug" value="https://nuget.pkg.github.com/sergey-v9/index.json" />
            </packageSources>
          </configuration>
          '@ | Set-Content -LiteralPath $config

          @'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using LadybugDB;

          string dbPath = Path.Combine(Path.GetTempPath(), "ladybug-published-" + Guid.NewGuid().ToString("N"));
          try
          {
              using var db = new Database(dbPath);
              using var conn = new Connection(db);

              CypherRoundTrip(conn);
              FtsRoundTrip(conn);
              VectorRoundTrip(conn);

              Console.WriteLine("published package consumer checks passed");
              return 0;
          }
          finally
          {
              TryDelete(dbPath);
          }

          static void CypherRoundTrip(Connection conn)
          {
              conn.Query("CREATE NODE TABLE Person(name STRING, age INT64, PRIMARY KEY(name))").Dispose();
              conn.Query("CREATE (:Person {name: 'Alice', age: 30})").Dispose();
              conn.Query("CREATE (:Person {name: 'Bob', age: 42})").Dispose();

              using QueryResult result = conn.Query("MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age");
              List<object?[]> rows = result.Rows().ToList();

              Require(rows.Count == 2, "expected two Person rows");
              Require((string?)rows[0][0] == "Alice" && Convert.ToInt64(rows[0][1]) == 30L, "Alice row mismatch");
              Require((string?)rows[1][0] == "Bob" && Convert.ToInt64(rows[1][1]) == 42L, "Bob row mismatch");
          }

          static void FtsRoundTrip(Connection conn)
          {
              conn.Query("CREATE NODE TABLE Entity(name STRING, summary STRING, PRIMARY KEY(name))").Dispose();
              conn.Query("CREATE (:Entity {name: 'Alice', summary: 'a software engineer who loves graph databases'})").Dispose();
              conn.Query("CREATE (:Entity {name: 'Bob', summary: 'a painter and a sculptor of fine art'})").Dispose();
              conn.Query("CREATE (:Entity {name: 'Carol', summary: 'a database administrator and graph theorist'})").Dispose();

              InstallAndLoad(conn, "fts");
              conn.Query("CALL CREATE_FTS_INDEX('Entity', 'node_name_and_summary', ['name', 'summary'])").Dispose();

              using PreparedStatement stmt = conn.Prepare(
                  "CALL QUERY_FTS_INDEX('Entity', 'node_name_and_summary', $query, TOP := $limit) " +
                  "RETURN node.name AS name, score ORDER BY score DESC");
              stmt.Bind("query", "graph databases");
              stmt.Bind("limit", 5L);

              using QueryResult result = stmt.Execute();
              List<object?[]> rows = result.Rows().ToList();
              List<string?> names = rows.Select(r => (string?)r[0]).ToList();

              Require(rows.Count > 0, "expected FTS rows");
              Require(names.Contains("Alice"), "FTS result should include Alice");
              Require(!names.Contains("Bob"), "FTS result should not include Bob");
              Require(rows.All(r => Convert.ToDouble(r[1]) > 0.0), "FTS scores must be positive");
          }

          static void VectorRoundTrip(Connection conn)
          {
              InstallAndLoad(conn, "vector");

              conn.Query("CREATE NODE TABLE Doc(id STRING, name_embedding FLOAT[3], PRIMARY KEY(id))").Dispose();
              conn.Query("CREATE (:Doc {id: 'a', name_embedding: [1.0, 0.0, 0.0]})").Dispose();
              conn.Query("CREATE (:Doc {id: 'b', name_embedding: [0.0, 1.0, 0.0]})").Dispose();
              conn.Query("CREATE (:Doc {id: 'c', name_embedding: [0.9, 0.1, 0.0]})").Dispose();

              using PreparedStatement stmt = conn.Prepare(
                  "MATCH (n:Doc) " +
                  "WITH n, array_cosine_similarity(n.name_embedding, CAST($search_vector AS FLOAT[3])) AS score " +
                  "WHERE score > $min_score " +
                  "RETURN n.id AS id, score ORDER BY score DESC");
              stmt.Bind("search_vector", new List<float> { 1.0f, 0.0f, 0.0f });
              stmt.Bind("min_score", 0.5);

              using QueryResult result = stmt.Execute();
              List<object?[]> rows = result.Rows().ToList();
              List<string?> ids = rows.Select(r => (string?)r[0]).ToList();

              Require(ids.Count >= 2, "expected vector rows");
              Require(ids[0] == "a", "identical vector should rank first");
              Require(ids.Contains("c"), "near vector should survive threshold");
              Require(!ids.Contains("b"), "orthogonal vector should be filtered out");
              Require(rows.All(r => Convert.ToDouble(r[1]) > 0.5), "vector scores must exceed threshold");
          }

          static void InstallAndLoad(Connection conn, string extension)
          {
              conn.InstallExtension(extension);
              conn.LoadExtension(extension);
          }

          static void Require(bool condition, string message)
          {
              if (!condition)
              {
                  throw new InvalidOperationException(message);
              }
          }

          static void TryDelete(string path)
          {
              try
              {
                  if (Directory.Exists(path))
                  {
                      Directory.Delete(path, recursive: true);
                  }
                  else if (File.Exists(path))
                  {
                      File.Delete(path);
                  }
              }
              catch
              {
                  // Best-effort cleanup only.
              }
          }
          '@ | Set-Content -LiteralPath $program

          $restored = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            dotnet restore $project --configfile $config -r $env:RID
            if ($LASTEXITCODE -eq 0) {
              $restored = $true
              break
            }

            Write-Warning "restore attempt $attempt failed; waiting for GitHub Packages indexing"
            Start-Sleep -Seconds (10 * $attempt)
          }

          if (-not $restored) {
            throw "restore failed for LadybugDB $env:PACKAGE_VERSION on $env:RID"
          }

          dotnet run --project $project -c Release -r $env:RID --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
